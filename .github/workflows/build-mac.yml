name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean build directory
        run: rm -rf build

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy macOS app bundle
        run: macdeployqt build/ByteDanceTest.app -verbose=2

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteDanceTest-macOS
          path: build/ByteDanceTest.app
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean build directory
        run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Windows executable
        run: windeployqt build/ByteDanceTest.exe --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteDanceTest-Windows
          path: build/ByteDanceTest.exe
          retention-days: 30
